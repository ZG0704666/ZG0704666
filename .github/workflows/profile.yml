name: profile assets
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
concurrency: {group: profile-assets, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: install font shaping engine
        run: pip install -q fonttools uharfbuzz

      - name: generate live cards & stats (dark + light)
        run: python scripts/generate.py live dist
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PROFILE_LOGIN: "ZG0704666"}

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: output, build_dir: dist, jekyll: false}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
